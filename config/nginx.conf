worker_processes auto;
worker_shutdown_timeout 10m;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    include /etc/nginx/real-ip.conf;
    include /etc/nginx/conf.d/resolver.conf;
    server_tokens off;

    log_format main '[$time_local] $request $status - $host - forwarded_for: $http_x_forwarded_for - $remote_addr to: $upstream_addr - urt: $upstream_response_time msec: $msec req_t: $request_time ($http_referer $http_user_agent)';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=one:10m rate=200r/s;
    limit_req_status 429;
    client_max_body_size 5M;

    gzip on;
    gzip_types application/json;

    proxy_connect_timeout 3s;

    include /etc/nginx/conf/upstreams*.conf;

    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate /data/server.crt;
        ssl_certificate_key /data/server.key;

        limit_req zone=one burst=100;

        location /files/ {
            add_header Access-Control-Allow-Origin *;
            root /usr/share/nginx/www;
            location = /files/metrics.json {
                alias /srv/metrics/metrics.json;
            }
        }

        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        include /etc/nginx/conf/locations*.conf;
    }
}
