location /v1/elated-tan-skat {
    proxy_next_upstream error timeout non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
    proxy_pass http://elated-tan-skat/;
}
location /v1/ws/elated-tan-skat {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_pass http://ws-elated-tan-skat/;
}
location /fs/elated-tan-skat {
    rewrite /fs/elated-tan-skat/(.*) /elated-tan-skat/$1 break;
    proxy_pass http://storage-elated-tan-skat/;
}
location /v1/europa {
    proxy_next_upstream error timeout non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
    proxy_pass http://elated-tan-skat/;
}
location /v1/ws/europa {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_pass http://ws-elated-tan-skat/;
}
location /fs/europa {
    rewrite /fs/europa/(.*) /elated-tan-skat/$1 break;
    proxy_pass http://storage-elated-tan-skat/;
}
