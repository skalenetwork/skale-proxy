name: issue check

on:
  pull_request:
    types: [edited, synchronize, opened, reopened]

jobs:
  check-linked-issues:
    runs-on: ubuntu-24.04
    permissions:
      issues: read
      pull-requests: read
    steps:
      - id: get-issues
        uses: mondeja/pr-linked-issues-action@15e15b5aa999ae8a742117c9489aa63b1a007b76 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.get-issues.outputs.issues == ''
        run: exit 1
