name: ci

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy proxy tests
      - run: uv run pytest
      - name: nginx -t
        run: |
          cp -r tests/golden conf
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci -keyout data/server.key -out data/server.crt
          for alb in True False; do USE_ALB=$alb docker compose run --rm nginx nginx -t; done
