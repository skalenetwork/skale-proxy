[project]
name = "skale-proxy"
version = "3.0.0"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "skale.py==7.14.dev4",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true

[tool.pytest]
pythonpath = ["."]
