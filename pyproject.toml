[project]
name = "skale-proxy"
version = "3.0.0"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "skale.py==8.0dev0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true

[tool.pytest]
pythonpath = ["."]
